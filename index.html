            });
            if (!found) return null;
            return normalizeTeacherRecord({ ...found,
                teacherId: found.teacherId || found.guruId || found.id,
                userId: found.userId || user?.userId || user?.id || '',
                schoolId: found.schoolId || found.sekolahId || user?.schoolId || user?.sekolahId || '',
                schoolName: found.schoolName || found.sekolahName || getSchoolName(found.schoolId || found.sekolahId || user?.schoolId || user?.sekolahId || ''),
                classIds: found.classIds || found.kelasIds || [],
                subjectIds: found.subjectIds || found.mataPelajaranIds || []
            });
        };
        const getTeacherAssignments = (teacher, user) => {
            const teacherId = String(teacher?.teacherId || teacher?.guruId || teacher?.id || '').trim();
            const schoolRefName = String(teacher?.schoolName || teacher?.sekolahName || user?.schoolName || user?.sekolahName || '').trim();
            const schoolFromName = !teacher?.schoolId && !teacher?.sekolahId && !user?.schoolId && !user?.sekolahId && schoolRefName ? getRegisteredSchools().find(s => String(s?.name || s?.schoolName || '').trim().toLowerCase().replace(/\s+/g,' ') === schoolRefName.toLowerCase().replace(/\s+/g,' ')) : null;
            const schoolId = String(teacher?.schoolId || teacher?.sekolahId || user?.schoolId || user?.sekolahId || schoolFromName?.id || '').trim();
            const normalizeName = value => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const explicitClassIds = new Set([
                ...(Array.isArray(teacher?.classIds) ? teacher.classIds : []),
                ...(Array.isArray(teacher?.kelasIds) ? teacher.kelasIds : []),
                ...(teacher?.classId ? [teacher.classId] : []),
                ...(teacher?.kelasId ? [teacher.kelasId] : [])
            ].map(v => String(v).trim()).filter(Boolean));
            const explicitClassNames = new Set([
                ...(Array.isArray(teacher?.classNames) ? teacher.classNames : []),
                ...(Array.isArray(teacher?.kelas) ? teacher.kelas : []),
                ...(teacher?.className ? [teacher.className] : []),
                ...(teacher?.kelasNama ? [teacher.kelasNama] : [])
            ].map(normalizeName).filter(Boolean));

            const allClasses = typeof getRegisteredClasses === 'function' ? getRegisteredClasses() : mergeCollectionRecords('classes');
            const allStudents = getRegisteredStudents();
            const schoolStudents = allStudents.filter(s => {
                const sid = String(s?.schoolId || s?.sekolahId || '').trim();
                return schoolId && sid === schoolId && String(s?.status || 'ACTIVE').toUpperCase() !== 'INACTIVE';
            });

            // Jika guru sudah mempunyai penugasan kelas eksplisit, pertahankan penugasan tersebut.
            // Jika belum ada penugasan kelas, seluruh kelas yang mempunyai murid di sekolah guru
            // otomatis menjadi Kelas Saya. Ini membuat akun guru langsung terhubung dengan data
            // murid berdasarkan sekolah yang sama tanpa harus membuat relasi ID kelas secara manual.
            const teacherHasExplicitClassAssignment = explicitClassIds.size > 0 || explicitClassNames.size > 0 ||
                allClasses.some(c => {
                    const cTeacher = String(c?.homeroomTeacherId || c?.teacherId || c?.guruId || c?.waliKelasId || '').trim();
                    const cSchool = String(c?.schoolId || c?.sekolahId || '').trim();
                    return teacherId && cTeacher === teacherId && (!schoolId || !cSchool || cSchool === schoolId);
                });

            let classes;
            if (!teacherHasExplicitClassAssignment) {
                const byIdentity = new Map();
                const addClass = (c) => {
                    const name = String(c?.name || c?.className || c?.kelas || c?.nama || '').trim();
                    const id = String(c?.id || c?.classId || c?.kelasId || '').trim();
                    if (!name && !id) return;
                    const key = normalizeName(name) || id;
                    if (!byIdentity.has(key)) byIdentity.set(key, {
                        ...c,
                        id: id || `AUTO-CLASS-${String(key).replace(/[^a-z0-9]+/gi,'-')}`,
                        name: name || id,
                        classId: c?.classId || id,
                        className: c?.className || name,
                        schoolId: c?.schoolId || schoolId,
                        schoolName: c?.schoolName || getSchoolName(c?.schoolId || schoolId),
                        status: c?.status || 'ACTIVE'
                    });
                };
                allClasses.filter(c => {
                    const cSchool = String(c?.schoolId || c?.sekolahId || '').trim();
                    return schoolId && cSchool === schoolId && String(c?.status || 'ACTIVE').toUpperCase() !== 'INACTIVE';
                }).forEach(addClass);
                schoolStudents.forEach(s => addClass({
                    id: s?.classId || s?.kelasId || '',
                    name: s?.className || s?.class || s?.kelas || s?.namaKelas || s?.classId || s?.kelasId || '',
                    schoolId,
                    schoolName: s?.schoolName || getSchoolName(schoolId),
                    status: 'ACTIVE'
                }));
                classes = [...byIdentity.values()];
            } else {
                classes = allClasses.filter(c => {
                    const cid = String(c?.id || c?.classId || c?.kelasId || '').trim();
                    const cname = normalizeName(c?.name || c?.className || c?.kelas || c?.nama);
                    const cTeacher = String(c?.homeroomTeacherId || c?.teacherId || c?.guruId || c?.waliKelasId || '').trim();
                    const cSchool = String(c?.schoolId || c?.sekolahId || '').trim();
                    const schoolOk = !schoolId || !cSchool || cSchool === schoolId;
                    const teacherOk = (teacherId && cTeacher === teacherId) || (cid && explicitClassIds.has(cid)) || (cname && explicitClassNames.has(cname));
                    return schoolOk && teacherOk && String(c?.status || 'ACTIVE').toUpperCase() !== 'INACTIVE';
                });
                // Lengkapi kelas eksplisit dengan kelas yang hanya tersimpan di data murid.
                const known = new Set(classes.map(c => normalizeName(c?.name || c?.className || c?.kelas || c?.nama)).filter(Boolean));
                schoolStudents.forEach(s => {
                    const name = String(s?.className || s?.class || s?.kelas || s?.namaKelas || '').trim();
                    if (!name || known.has(normalizeName(name))) return;
                    if (explicitClassNames.has(normalizeName(name)) || explicitClassIds.has(String(s?.classId || s?.kelasId || '').trim())) {
                        classes.push({ id: s?.classId || s?.kelasId || `AUTO-CLASS-${name}`, name, classId: s?.classId || s?.kelasId || name, className: name, schoolId, schoolName: s?.schoolName || getSchoolName(schoolId), status: 'ACTIVE' });
                        known.add(normalizeName(name));
                    }
                });
            }

            const classIds = new Set();
            const classNames = new Set();
            classes.forEach(c => {
                [c?.id, c?.classId, c?.kelasId].map(v => String(v || '').trim()).filter(Boolean).forEach(v => classIds.add(v));
                [c?.name, c?.className, c?.kelas, c?.nama].map(normalizeName).filter(Boolean).forEach(v => classNames.add(v));
            });

            const students = allStudents.filter(s => {
                const sSchool = String(s?.schoolId || s?.sekolahId || '').trim();
                const sClassId = String(s?.classId || s?.kelasId || '').trim();
                const sClassName = normalizeName(s?.className || s?.class || s?.kelas || s?.namaKelas || '');
                return (!schoolId || sSchool === schoolId) &&
                    String(s?.status || 'ACTIVE').toUpperCase() !== 'INACTIVE' &&
                    (classIds.has(sClassId) || (sClassName && classNames.has(sClassName)) || (!classes.length && schoolId === sSchool));
            });
            return { classes, students };
        };

        const hydrateGuruUser = (user) => {
            if (!user || String(user.role || '').toUpperCase() !== 'GURU') return user;
            const teacher = getTeacherForUser(user);
            if (!teacher) return user;
            const schoolId = String(teacher.schoolId || teacher.sekolahId || user.schoolId || user.sekolahId || '').trim();
            const assignments = getTeacherAssignments(teacher, { ...user, schoolId });
            const classIds = [...new Set([
                ...(teacher.classIds || teacher.kelasIds || []),
                ...assignments.classes.map(c => c.id || c.classId || c.kelasId)
            ].map(String).filter(Boolean))];
            return {
                ...user,
                ...teacher,
                id: user.id || teacher.userId || teacher.id,
                userId: user.userId || teacher.userId || user.id,
                teacherId: teacher.teacherId || teacher.guruId || teacher.id,
                guruId: teacher.teacherId || teacher.guruId || teacher.id,
                role: 'GURU',
                schoolId,
                schoolName: teacher.schoolName || getSchoolName(schoolId),
                classIds,
                classNames: assignments.classes.map(c => c.name || c.className || c.nama || c.id).filter(Boolean),
                subjectIds: teacher.subjectIds || teacher.mataPelajaranIds || [],
                name: teacher.name || user.name || '',
                email: teacher.email || user.email || '',
                phone: teacher.phone || user.phone || '',
                district: teacher.district || user.district || '',
                username: teacher.username || user.username || ''
            };
        };

        const mockApiService = {
            login: async (identifier, password) => {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                      try {
                        const normalizedIdentifier = String(identifier ?? '').trim().toLowerCase();
                        const submittedPassword = String(password ?? '');
                        const sources = [
                            { key: 'users', role: 'ADMIN_SUPER' },
                            { key: 'teachers', role: 'GURU' },
                            { key: 'students', role: 'MURID' },
                            { key: 'parents', role: 'ORANG_TUA' }
                        ];
                        const usernameFields = ['username', 'userName', 'namaPengguna', 'login', 'email', 'nama pengguna'];
                        const passwordFields = ['password', 'kataSandi', 'kata_sandi', 'pass', 'kata sandi'];
                        const roleMap = {
                            admin: 'ADMIN_SUPER', administrator: 'ADMIN_SUPER',
                            guru: 'GURU', teacher: 'GURU',
                            murid: 'MURID', siswa: 'MURID', student: 'MURID',
                            'orang tua': 'ORANG_TUA', wali: 'ORANG_TUA', parent: 'ORANG_TUA'
                        };
                        const normalizeRole = value => roleMap[String(value ?? '').trim().toLowerCase()] || value;
                        const isInactive = (value) => value?.active === false || value?.aktif === false || ['INACTIVE', 'NONAKTIF', 'SUSPENDED', 'DISABLED', 'BLOCKED', 'DELETED'].includes(String(value?.status ?? value ?? '').trim().toUpperCase());
                        let matchedRecord = null;
                        let matchedSource = null;
                        let missingCredentials = false;
                        const adminRecords = readLatestAccountRecords().reverse();
                        for (const record of adminRecords) {
                            const username = usernameFields.map(field => record[field]).find(value => value !== undefined && value !== null && String(value).trim() !== '');
                            const storedPassword = passwordFields.map(field => record[field]).find(value => value !== undefined && value !== null);
                            const role = normalizeAdminRole(record);
                            if (username !== undefined && String(username).trim().toLowerCase() === normalizedIdentifier && (role === 'ADMIN_SUPER' || record.isSuperAdmin === true || record.superAdmin === true)) {
                                if (storedPassword === undefined || String(storedPassword) !== submittedPassword) continue;
                                matchedRecord = { ...record, role: 'ADMIN_SUPER' }; matchedSource = { role: 'ADMIN_SUPER' }; break;
                            }
                        }
                        for (const source of sources) {
                            if (matchedRecord) break;
                            let records = mergeCollectionRecords(source.key);
                            if (source.key === 'teachers') {
                                records = records.map(record => normalizeTeacherRecord(record));
                            }
                            for (const record of records) {
                                const teacherRecord = source.key === 'teachers' ? normalizeTeacherRecord(record) : record;
                                const username = usernameFields.map(field => teacherRecord[field]).find(value => value !== undefined && value !== null && String(value).trim() !== '');
                                const storedPassword = passwordFields.map(field => teacherRecord[field]).find(value => value !== undefined && value !== null);
                                if (username !== undefined && String(username).trim().toLowerCase() === normalizedIdentifier) {
                                    if (storedPassword === undefined || String(storedPassword).trim() === '') { missingCredentials = true; continue; }
                                    if (String(storedPassword) === submittedPassword) { matchedRecord = teacherRecord; matchedSource = source; break; }
                                }
                            }
                            if (matchedRecord) break;
                        }
                        if (!matchedRecord) {
                            return reject({ code: missingCredentials ? 'AUTH_MISSING_CREDENTIALS' : 'AUTH_INVALID_CREDENTIALS', message: missingCredentials ? 'Kredensial akun belum tersedia.' : 'Username atau password salah' });
                        }
                        if (isInactive(matchedRecord.status)) return reject({ code: 'AUTH_ACCOUNT_SUSPENDED', message: 'Akun tidak aktif.' });
                        const role = normalizeRole(matchedRecord.role) || matchedSource.role;
                        let user = { ...matchedRecord, id: matchedRecord.id || matchedRecord.userId || matchedRecord.teacherId, role, username: usernameFields.map(field => matchedRecord[field]).find(value => value !== undefined && value !== null && String(value).trim() !== ''), password: undefined };
                        user = hydrateGuruUser(user);
                        const token = btoa(JSON.stringify({ userId: user.id, role, timestamp: Date.now() }));
                        resolve({ success: true, data: { token, user }, message: 'Login berhasil' });
                      } catch (error) {
                        reject({ code: error?.code || 'AUTH_LOGIN_ERROR', message: error?.message || 'Terjadi kesalahan saat memproses login.' });
                      }
                    }, 800);
                });
            },
            getDashboardData: async (token, role) => {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (!token) return reject({ status: 401, message: 'Unauthorized' });
                        try {
                            const payload = JSON.parse(atob(token));
                            if (payload.role !== role) {
                                return reject({ status: 403, message: 'Forbidden: Anda tidak memiliki hak akses.' });
                            }
                            resolve({ success: true, data: { activeExams: 2, syncStatus: 'Connected' } });
                        } catch (e) {
                            reject({ status: 401, message: 'Invalid Session' });
                        }
                    }, 500);
                });
            },
            startExamAttempt: async (scheduleId, studentId) => {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const schedule = DEMO_DB.examSchedules.find(s => s.id === scheduleId);
                        let participant = DEMO_DB.examParticipants.find(p => String(p.scheduleId || p.examScheduleId) === String(scheduleId) && String(p.studentId || p.muridId) === String(studentId));
                        const student = DEMO_DB.students.find(s => String(s.id || s.studentId) === String(studentId));
                        if (!participant && student) { participant = { id:`PART-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, scheduleId, studentId, status:'REGISTERED', createdAt:new Date().toISOString() }; DEMO_DB.examParticipants.push(participant); persistDurableCollection('examParticipants', DEMO_DB.examParticipants); }
                        // Setelah token diverifikasi di akun Murid, jangan ulangi filter schoolId/classId.
                        // Data peserta sudah berasal dari jadwal yang dipilih Admin Super; cakupan sekolah/kelas
                        // hanya menentukan daftar jadwal yang ditampilkan, bukan menghalangi ruang ujian.
                        if (!schedule || !student) return reject({ message: 'Jadwal atau data murid tidak ditemukan.'});
                        if (!['OPEN','PUBLISHED','ACTIVE','IN_PROGRESS'].includes(String(schedule.status || schedule.publishStatus || '').toUpperCase())) return reject({ message: 'Ujian belum dibuka atau sudah ditutup.' });

                        const scheduleExamKey = getStableExamKey(schedule);
                        const attempts = DEMO_DB.examAttempts.filter(a => a.studentId === studentId && (a.examKey === scheduleExamKey || a.scheduleId === scheduleId || getStableExamKey(DEMO_DB.examSchedules.find(s => s.id === a.scheduleId) || {}) === scheduleExamKey));
                        const activeAttempt = attempts.find(a => a.status === 'IN_PROGRESS');
                        const completedAttempts = attempts.filter(a => a.status === 'SUBMITTED' || a.status === 'COMPLETED');
                        const retryEnabled = schedule.attemptMode === 'RETRY' || schedule.allowRetry === true;
                        const maxAttempts = retryEnabled ? Math.max(2, Number(schedule.maxAttempts) || 2) : 1;
                        let attempt = activeAttempt;
                        if (!attempt) {
                            if (completedAttempts.length >= maxAttempts) return reject({ message: `Batas percobaan ujian sudah tercapai (${maxAttempts} kali).` });
                            attempt = {
                                id: `ATT-${Date.now()}`,
                                scheduleId,
                                studentId,
                                examKey: scheduleExamKey,
                                attemptNumber: completedAttempts.length + 1,
                                status: 'IN_PROGRESS',
                                serverStartTime: new Date().toISOString(),
                                expectedEndTime: new Date(Date.now() + Number(schedule.duration || 60) * 60000).toISOString(),
                            };
                            DEMO_DB.examAttempts.push(attempt);
                            participant.status = 'IN_PROGRESS';
                        }

                        const pkg = DEMO_DB.examPackages.find(p => p.id === schedule.packageId);
                        const packageQuestionIds = pkg?.questionIds || pkg?.bankQuestionIds || [];
                        // Soal ujian hanya berasal dari soal yang dipilih dalam Paket Ujian.
                        const sourceQuestions = packageQuestionIds.length
                            ? DEMO_DB.questions.filter(q => packageQuestionIds.map(String).includes(String(q.id)))
                            : DEMO_DB.questions.filter(q => q.subjectId === pkg?.subjectId);
                        // BUANG correctAnswer sebelum dikirim ke UI!
                        const questionsSnapshot = sourceQuestions
                            .map(q => {
                                const { correctAnswer, author, createdAt, status, ...safeQuestion } = q;
                                return safeQuestion;
                            });

                        const existingAnswers = DEMO_DB.answers.filter(ans => ans.attemptId === attempt.id);

                        resolve({ 
                            success: true, 
                            data: { 
                                attempt, 
                                schedule, 
                                package: pkg, 
                                questions: questionsSnapshot,
                                answers: existingAnswers,
                                serverTime: new Date().toISOString()
                            } 
                        });
                    }, 800);
                });
            },
            syncAnswer: async (attemptId, questionId, answerData, isFlagged) => {
                const record = DEMO_DB.answers.find(a => String(a.attemptId) === String(attemptId) && String(a.questionId) === String(questionId));
                const now = new Date().toISOString();
                if (record) {
                    record.answerData = answerData;
                    record.isFlagged = !!isFlagged;
                    record.updatedAt = now;
                } else {
                    DEMO_DB.answers.push({ id:`ANS-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, attemptId, questionId, answerData, isFlagged:!!isFlagged, updatedAt: now });
                }
                persistDurableCollection('answers', DEMO_DB.answers);
                window.dispatchEvent(new CustomEvent('aksara:answers-changed'));
                // Sinkron jawaban ke Firebase agar dapat dipantau Guru/Admin Super dari perangkat lain.
                try { await aksaraFbPersistCollection('answers', DEMO_DB.answers); } catch(e) { console.warn('[AKSARA] Sinkron jawaban:', e); }
                return { success:true, timestamp:now };
            },
            submitExam: async (attemptId) => {
                const attempt = DEMO_DB.examAttempts.find(a => String(a.id) === String(attemptId));
                if (!attempt) throw new Error('Percobaan ujian tidak ditemukan.');
                if (attempt.status === 'SUBMITTED' || attempt.status === 'COMPLETED') {
                    const existing = DEMO_DB.examResults.find(r => String(r.attemptId) === String(attemptId));
                    if (existing) return { success:true, result:existing, alreadySubmitted:true };
                }
                // Pastikan semua jawaban yang sedang berada di state UI sudah tersimpan sebelum koreksi.
                persistDurableCollection('answers', DEMO_DB.answers);
                attempt.status = 'SUBMITTED';
                attempt.submittedAt = new Date().toISOString();
                attempt.updatedAt = attempt.submittedAt;
                const participant = DEMO_DB.examParticipants.find(p => String(p.scheduleId) === String(attempt.scheduleId) && String(p.studentId) === String(attempt.studentId));
                if (participant) { participant.status='SUBMITTED'; participant.submittedAt=attempt.submittedAt; }
                persistDurableCollection('examAttempts', DEMO_DB.examAttempts);
                persistDurableCollection('examParticipants', DEMO_DB.examParticipants);
                const result = mockApiService.internalAutoGrade(attempt.id);
                persistDurableCollection('examResults', DEMO_DB.examResults);
                try {
                    await Promise.all([
                        aksaraFbPersistCollection('examAttempts', DEMO_DB.examAttempts),
                        aksaraFbPersistCollection('examParticipants', DEMO_DB.examParticipants),
                        aksaraFbPersistCollection('answers', DEMO_DB.answers),
                        aksaraFbPersistCollection('examResults', DEMO_DB.examResults)
                    ]);
                } catch(e) { console.warn('[AKSARA] Sinkron hasil ujian:', e); }
                window.dispatchEvent(new CustomEvent('aksara:attempts-changed'));
                window.dispatchEvent(new CustomEvent('aksara:answers-changed'));
                window.dispatchEvent(new CustomEvent('aksara:results-changed'));
                return { success:true, result };
            },
            internalAutoGrade: (attemptId) => {
                const attempt = DEMO_DB.examAttempts.find(a => String(a.id) === String(attemptId));
                if (!attempt) throw new Error('Attempt tidak ditemukan.');
                const schedule = DEMO_DB.examSchedules.find(s => String(s.id || s.scheduleId) === String(attempt.scheduleId));
                if (!schedule) throw new Error('Jadwal ujian tidak ditemukan.');
                const pkg = DEMO_DB.examPackages.find(p => String(p.id) === String(schedule.packageId || schedule.examId));
                if (!pkg) throw new Error('Paket ujian tidak ditemukan.');
                const packageQuestionIds = pkg.questionIds || pkg.bankQuestionIds || [];
                const questions = packageQuestionIds.length
                    ? DEMO_DB.questions.filter(q => packageQuestionIds.map(String).includes(String(q.id)))
                    : DEMO_DB.questions.filter(q => String(q.subjectId) === String(pkg.subjectId));
                const answers = DEMO_DB.answers.filter(a => String(a.attemptId) === String(attemptId));
                const getAnswer = q => answers.find(a => String(a.questionId) === String(q.id));
                const norm = v => String(v ?? '').trim().toLowerCase();
                const arr = v => Array.isArray(v) ? v.map(String).map(norm).filter(Boolean) : (v == null || v === '' ? [] : String(v).split(',').map(norm).filter(Boolean));
                let totalScore=0, maxScore=0, correctCount=0, incorrectCount=0, unansweredCount=0, hasManualReview=false;
                const answerScores=[];
                questions.forEach(q => {
                    const weight=Math.max(0, Number(q.weight ?? q.score ?? 1) || 1);
                    const type=String(q.type||'MULTIPLE_CHOICE').toUpperCase();
                    let earned=0, status='UNANSWERED';
                    const ans=getAnswer(q);
                    const value=ans?.answerData;
                    if (type==='TRUE_FALSE') {
                        const rows=Array.isArray(q.statements)?q.statements:[];
                        const rowMax=rows.length*weight; maxScore+=rowMax;
                        let answered=0, correct=0;
                        rows.forEach(row=>{
                            const rowAns=answers.find(a=>String(a.questionId)===String(row.id));
                            if(rowAns?.answerData!==undefined && rowAns?.answerData!==null && String(rowAns.answerData)!==''){answered++; if(norm(rowAns.answerData)===norm(row.key)) correct++;}
                        });
                        earned=correct*weight; correctCount+=correct; incorrectCount+=Math.max(0,answered-correct); unansweredCount+=Math.max(0,rows.length-answered);
                        status=answered===0?'UNANSWERED':(correct===rows.length?'CORRECT':'PARTIAL');
                    } else {
                        maxScore+=weight;
                        const selected=arr(value);
                        if(!selected.length){ unansweredCount++; }
                        else if(type==='MULTIPLE_CHOICE' || type==='MCMA' || type==='MULTIPLE_SELECT') {
                            const keys=arr(q.correctAnswer ?? q.answerKey ?? q.answers);
                            const same=selected.length===keys.length && selected.every(x=>keys.includes(x));
                            if(same){earned=weight; correctCount++; status='CORRECT';} else {incorrectCount++; status='INCORRECT';}
                        } else if(type==='MATCHING') {
                            const pairs=Array.isArray(q.pairs)?q.pairs:[];
                            const expected=pairs.map(p=>String(p.answerRightId||p.right?.id||'')).filter(Boolean);
                            const got=Array.isArray(value)?value.map(v=>String(v.answerRightId||v.rightId||v)).filter(Boolean):arr(value);
                            const correct=expected.length && expected.length===got.length && expected.every(x=>got.includes(x));
                            if(correct){earned=weight; correctCount++; status='CORRECT';} else {incorrectCount++; status='INCORRECT';}
                        } else {
                            // Essay/short answer memerlukan review guru kecuali tersedia kunci eksplisit.
                            const keys=arr(q.correctAnswer ?? q.answerKey ?? q.answers);
                            if(keys.length){ const same=keys.includes(norm(value)); if(same){earned=weight;correctCount++;status='CORRECT';}else{incorrectCount++;status='INCORRECT';} }
                            else {hasManualReview=true; status='REVIEW';}
                        }
                    }
                    totalScore+=earned;
                    answerScores.push({questionId:q.id, attemptId, answerData:value ?? null, score:earned, maxScore: type==='TRUE_FALSE' ? (Array.isArray(q.statements)?q.statements.length*weight:weight) : weight, status});
                });
                const percentage=maxScore>0?(totalScore/maxScore)*100:0;
                const gradingScale=Array.isArray(pkg.gradingScale)?pkg.gradingScale:null;
                let grade='D';

        const aksaraFbPreloadLogin = async (identifier, password) => {
            await aksaraFbReady();
            const raw = String(identifier || '').trim().toLowerCase();
            const email = raw.includes('@') ? raw : `${raw.replace(/[^a-z0-9._-]/g,'_')}@login.aksara.id`;

            if (!profile) {
                const users = (await AKSARA_FIREBASE.db.ref('users').once('value')).val();

        const aksaraFbEnsureLocalUserFirebase = async (identifier, password, localUser) => {

                    cred = await AKSARA_FIREBASE.auth.createUserWithEmailAndPassword(email, String(password || ''));

                const rootSnap = await AKSARA_FIREBASE.db.ref().once('value');

" className="p-10 text-center text-gray-500">Belum ada data sekolah yang sesuai.</td></tr>}</tbody></table></div></div>
                {modal && <div role="dialog" aria-modal="true" onClick={closeModal} className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-gray-900/50"><form onSubmit={saveSchool} onClick={e => e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto"><div className="flex justify-between items-center mb-5"><h3 className="text-xl font-bold">{modal === 'edit' ? 'Edit Sekolah' : 'Tambah Sekolah'}</h3><button type="button" aria-label="Tutup" onClick={closeModal} className="text-2xl text-gray-500">×</button></div>{error && <div className="mb-4 p-3 rounded-lg bg-red-50 text-red-700">{error}</div>}<div className="grid md:grid-cols-2 gap-4">{[['name','Nama Sekolah'],['npsn','NPSN'],['district','Kecamatan'],['address','Alamat'],['principalName','Nama Kepala Sekolah'],['phone','Nomor Telepon']].map(([key,label]) => <label key={key} className="text-sm font-medium">{label}{['name','npsn','district'].includes(key) && <span className="text-red-500"> *</span>}<input value={form[key] || ''} onChange={e => setForm({ ...form, [key]: e.target.value })} className="mt-1 w-full border rounded-lg p-2.5" /></label>)}<label className="text-sm font-medium">Status<select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className="mt-1 w-full border rounded-lg p-2.5"><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option></select></label></div><div className="flex justify-end gap-3 mt-6"><button type="button" onClick={closeModal} className="px-4 py-2 bg-gray-100 rounded-lg">Batal</button><button type="submit" className="px-4 py-2 bg-aksara-600 text-white rounded-lg">Simpan Sekolah</button></div></form></div>}

        const normalizeCollectionArray = (value) => {
            if (Array.isArray(value)) return value.filter(item => item && typeof item === 'object');
            if (value && typeof value === 'object') {
                return Object.entries(value).map(([key, item]) => {
                    if (!item || typeof item !== 'object') return null;
                    return { id: item.id || item.userId || item.studentId || item.parentId || item.nisn || key, ...item };
                }).filter(Boolean);
            }
            return [];
        };
        const readLocalCollection = (key) => {
            try { const raw = localStorage.getItem(`aksara_${key}`); const parsed = raw ? JSON.parse(raw) : []; return normalizeCollectionArray(parsed); } catch (e) { return []; }
        };
        const mergeCollectionRecords = (key) => {
            const primary = normalizeCollectionArray(DEMO_DB[key]);
            const local = readLocalCollection(key);
            const durable = readLocalCollection(`master_${key}`);
            const firebaseCache = readLocalCollection(`firebase_${key}`);
            const out = []; const seen = new Map();
            [...primary, ...local, ...durable, ...firebaseCache].forEach(item => {
                if (!item || typeof item !== 'object') return;
                const id = String(item.id || item.userId || item.studentId || item.parentId || item.nisn || item.username || '').trim();
                const keyId = id || JSON.stringify(item);
                if (seen.has(keyId)) {
                    const index = seen.get(keyId);
                    out[index] = { ...out[index], ...item };
                } else {
                    seen.set(keyId, out.length); out.push({ ...item });
                }
            });
            return out;
        };
        const getRegisteredSchools = () => mergeCollectionRecords('schools').filter(s => s && s.id && (s.name || s.schoolName));
        const getSchoolName = (schoolId) => {
            const found = getRegisteredSchools().find(s => String(s.id) === String(schoolId));
            return found?.name || found?.schoolName || '';
        };
        const readDurableCollection = (key) => {
            const sources = [
                readLocalCollection(key),
                readLocalCollection(`firebase_${key}`),
                readLocalCollection(`master_${key}`)
            ];
            const out = []; const seen = new Set();
            sources.flat().forEach(item => {
                if (!item || typeof item !== 'object') return;
                const identity = String(item.id || item.studentId || item.parentId || item.nisn || item.username || '').trim();
                const k = identity || JSON.stringify(item);
                if (seen.has(k)) return;
                seen.add(k); out.push({ ...item });
            });
            return out;
        };
        const persistDurableCollection = (key, rows) => {
            const data = Array.isArray(rows) ? rows : [];
            try {
                localStorage.setItem(`aksara_${key}`, JSON.stringify(data));
                localStorage.setItem(`master_${key}`, JSON.stringify(data));
            } catch(e) {}
            if (AKSARA_FIREBASE_SYNC_KEYS.includes(key) && AKSARA_FIREBASE.auth?.currentUser && !AKSARA_FIREBASE.applying) {
                try {
                    if (!AKSARA_FIREBASE.persistTimers) AKSARA_FIREBASE.persistTimers = {};

                    AKSARA_FIREBASE.persistTimers[key] = setTimeout(() => {
                        aksaraFbPersistCollection(key, data).catch(err => console.warn('[AKSARA] Auto-sync', key, err));
                    }, 180);
                } catch(e) {}
            }
        };
        const aksaraFbPersistCollection = async (key, rows) => {
            const data = Array.isArray(rows) ? rows : [];

        const getRegisteredStudents = () => {
            // SUMBER UTAMA DATA MURID: semua record students + semua akun users ber-role MURID.
            // Ini memastikan akun Murid yang sudah terdaftar tetap tampil meskipun record students belum terbentuk/lengkap.
            const rawStudents = mergeCollectionRecords('students').map(s => ({ ...s }));
            const rawUsers = mergeCollectionRecords('users')
                .filter(u => String(u?.role || '').trim().toUpperCase() === 'MURID')
                .map(u => ({ ...u }));
            const normalize = (s, fallback = {}) => {
                const merged = { ...fallback, ...s };
                const classValue = merged.className || merged.class || merged.classId || merged.kelas || merged.kelasId || '';
                const schoolId = merged.schoolId || merged.sekolahId || '';
                return { ...merged,
                    id: merged.studentId || merged.id || merged.userId || `STD-${merged.nisn || merged.username || Date.now()}-${Math.random().toString(36).slice(2,7)}`,
                    studentId: merged.studentId || (String(merged.id || '').startsWith('STD-') ? merged.id : ''),
                    userId: merged.userId || '',
                    name: merged.name || merged.nama || merged.fullName || merged.username || 'Murid',
                    nisn: merged.nisn || merged.nis || '',
                    schoolId, schoolName: merged.schoolName || merged.sekolahName || merged.asalSekolah || getSchoolName(schoolId),
                    classId: classValue, className: classValue,
                    gender: merged.gender || merged.jenisKelamin || merged.genderName || '-',
                    status: merged.status || 'ACTIVE',
                    username: merged.username || '', password: merged.password || ''
                };
            };
            const result = [];
            const indexByIdentity = new Map();
            const identity = s => {
                const nisn = String(s.nisn || s.nis || '').trim();
                if (nisn) return `nisn:${nisn}`;
                const sid = String(s.studentId || '').trim();
                if (sid) return `student:${sid}`;
                const uid = String(s.userId || s.id || '').trim();
                if (uid) return `user:${uid}`;
                const username = String(s.username || '').trim().toLowerCase();
                return username ? `username:${username}` : `anon:${result.length}`;
            };
            const add = (item, source) => {
                const s = normalize(item, source === 'user' ? { userId: item.id, studentId: item.studentId || '', name: item.name || item.username, nisn: item.nisn || '' } : {});
                const key = identity(s);
                const existingIndex = indexByIdentity.get(key);
                if (existingIndex !== undefined) {
                    const existing = result[existingIndex];
                    const merged = { ...existing };
                    Object.keys(s).forEach(k => {
                        if ((merged[k] === undefined || merged[k] === null || merged[k] === '' || merged[k] === '-') && s[k] !== undefined && s[k] !== null && s[k] !== '' && s[k] !== '-') merged[k] = s[k];
                    });
                    result[existingIndex] = normalize(merged);
                } else {
                    indexByIdentity.set(key, result.length);
                    result.push(s);
                }
            };
            rawStudents.forEach(s => add(s, 'student'));
            rawUsers.forEach(u => add(u, 'user'));
            return result;
        };

        const getActualRegisteredUsers = () => {
            const out = []; const seen = new Set();

            };
            const filteredStudents = students.filter(s => !selectedSchool || String(s.schoolId || s.sekolahId || '') === String(selectedSchool)).filter(s => {
                const cls = DEMO_DB.classes.find(c => c.id === s.classId);
                const query = search.trim().toLowerCase();
                return !query || `${s.name} ${s.nisn} ${s.className || s.kelas || s.kelasId || s.classId || ''} ${cls?.name || ''}`.toLowerCase().includes(query);
            });
            return (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-heading font-bold text-gray-900">Data Murid</h2>
                            <p className="text-gray-500 text-sm">Kelola profil murid, kelas, dan relasi orang tua/wali.</p>
                        </div>
                        <div className="flex gap-2">
                            <button className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                                <Icon name="upload" className="w-4 h-4"/> Import Excel/CSV
                            </button><MasterImportPanel kind="students" />
                            <button onClick={() => openStudentModal()} className="px-4 py-2 bg-aksara-600 rounded-lg text-sm font-medium text-white hover:bg-aksara-900 flex items-center gap-2">
                                <Icon name="user-plus" className="w-4 h-4"/> Tambah Murid
                            </button>
                        </div>
                    </div>

                    {notice && <div role="status" className="p-3 rounded-lg border border-teal-200 bg-teal-50 text-teal-700">{notice}</div>}
                    <div className="flex items-center gap-3 flex-wrap"><label className="text-sm font-medium">Sekolah<select aria-label="Filter sekolah murid" value={selectedSchool} onChange={e => setSelectedSchool(e.target.value)} className="ml-2 border rounded-lg p-2 min-w-64"><option value="">Semua sekolah</option>{registeredSchools.map(sc => <option key={sc.id} value={sc.id}>{sc.name}{sc.npsn ? ` — ${sc.npsn}` : ''}</option>)}</select></label><span className="text-sm text-gray-500">{filteredStudents.length} murid</span></div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="p-4 border-b border-gray-200 bg-gray-50 flex gap-4">
                            <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Cari nama murid, NISN..." className="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm outline-none" />
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50/50 border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500 font-semibold">
                                        <th className="px-6 py-4">NISN & Nama</th>
                                        <th className="px-6 py-4">Kelas</th>
                                        <th className="px-6 py-4">Gender</th>
                                        <th className="px-6 py-4">Status</th>
                                        <th className="px-6 py-4 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100 text-sm">
                                    {filteredStudents.map(s => {
                                        const cls = DEMO_DB.classes.find(c => String(c.id) === String(s.classId));
                                        const classDisplay = s.className || s.kelas || s.kelasId || s.classId || cls?.name || '';
                                        return (
                                            <tr key={s.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4">
                                                    <div className="font-bold text-gray-900">{s.name}</div>
                                                    <div className="text-xs font-mono text-gray-500">{s.nisn}</div>
                                                </td>
                                                <td className="px-6 py-4 text-gray-700">{s.className || s.classId || cls?.name || '-'}</td>
                                                <td className="px-6 py-4 text-gray-700">{s.gender}</td>
                                                <td className="px-6 py-4"><Badge status={s.status} /></td>
                                                <td className="px-6 py-4 text-right">
                                                    <button onClick={() => openStudentModal(s)} className="px-2 py-1 text-xs text-aksara-600 border rounded">Edit</button><button onClick={async () => {
                                                    if (!window.confirm(`Hapus murid ${s.name || ''} beserta akun dan data wali terkait?`)) return;
                                                    const sid = String(s.id || s.studentId || '').trim();
                                                    const uid = String(s.userId || '').trim();
                                                    const parentIds = new Set((DEMO_DB.parents || []).filter(p => String(p.studentId || '') === sid).map(p => String(p.id)));
                                                    const updatedStudents = (DEMO_DB.students || []).filter(x => String(x.id || x.studentId || '') !== sid && String(x.studentId || '') !== sid);
                                                    const updatedParents = (DEMO_DB.parents || []).filter(p => String(p.studentId || '') !== sid && !parentIds.has(String(p.id)));
                                                    const updatedRelations = (DEMO_DB.parent_student || []).filter(r => String(r.studentId || '') !== sid && !parentIds.has(String(r.parentId || '')));
                                                    const updatedUsers = (DEMO_DB.users || []).filter(u => String(u.studentId || '') !== sid && String(u.id || '') !== uid);
                                                    DEMO_DB.students = updatedStudents;
                                                    DEMO_DB.parents = updatedParents;
                                                    DEMO_DB.parent_student = updatedRelations;
                                                    DEMO_DB.users = updatedUsers;
                                                    persistDurableCollection('students', updatedStudents);
                                                    persistDurableCollection('parents', updatedParents);
                                                    persistDurableCollection('parent_student', updatedRelations);
                                                    persistDurableCollection('users', updatedUsers);
                                                    setStudentRefresh(v => v + 1);
                                                    window.dispatchEvent(new Event('aksara:students-changed'));
                                                    window.dispatchEvent(new Event('aksara:users-changed'));
                                                    window.dispatchEvent(new Event('aksara:parents-changed'));
                                                    setNotice('Murid, akun, data wali, dan relasinya sedang dihapus dari Firebase...');
                                                    try {
                                                        await aksaraFbPersistCollection('students', updatedStudents);
                                                        await aksaraFbPersistCollection('parents', updatedParents);
                                                        await aksaraFbPersistCollection('parent_student', updatedRelations);
                                                        await aksaraFbPersistCollection('users', updatedUsers);
                                                        setNotice('Murid dan seluruh data terkait berhasil dihapus.');
                                                    } catch (err) {
                                                        console.warn('[AKSARA] Sinkronisasi penghapusan murid gagal:', err);
                                                        setNotice('Data berhasil dihapus dari tampilan. Firebase akan disinkronkan kembali saat koneksi tersedia.');
                                                    }
                                                    setTimeout(() => setNotice(''), 3500);
                                                }} className="px-2 py-1 text-xs text-red-600 border rounded">Hapus</button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    {modal === 'student' && <div role="dialog" aria-modal="true" onClick={closeModal} onKeyDown={e => e.key === 'Escape' && closeModal()} className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-gray-900/50"><form onSubmit={saveStudent} onClick={e => e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6"><div className="flex justify-between items-center mb-5"><h3 className="text-xl font-bold">{editingId ? 'Edit Murid' : 'Tambah Murid'}</h3><button type="button" onClick={closeModal} className="text-2xl text-gray-500" aria-label="Tutup">×</button></div>{error && <div className="mb-4 p-3 rounded-lg bg-red-50 text-red-700">{error}</div>}<div className="grid md:grid-cols-2 gap-4">{[['name','Nama Lengkap'],['nisn','NISN'],['parentName','Nama Orang Tua/Wali'],['username','Username'],['password','Password']].map(([key,label]) => <label key={key} className="text-sm font-medium">{label}<div className="relative mt-1"><input type={key === 'password' && !showPassword ? 'password' : 'text'} value={form[key]} onChange={e => setForm({ ...form, [key]: e.target.value })} className="w-full border rounded-lg p-2.5 pr-20" />{key === 'password' && <button type="button" onClick={() => setShowPassword(v => !v)} className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-aksara-600">{showPassword ? 'Sembunyikan' : 'Tampilkan'}</button>}</div></label>)}<label className="text-sm font-medium">Asal Sekolah<select value={form.schoolId} onChange={e => setForm({ ...form, schoolId: e.target.value, classId: '' })} className="mt-1 w-full border rounded-lg p-2.5"><option value="">Pilih sekolah</option>{getRegisteredSchools().map(sc => <option key={sc.id} value={sc.id}>{sc.name}{sc.npsn ? ` — ${sc.npsn}` : ''}</option>)}</select></label><label className="text-sm font-medium">Kelas *<select required value={form.classId} onChange={e => setForm({ ...form, classId: e.target.value })} className="mt-1 w-full border rounded-lg p-2.5"><option value="">Pilih kelas</option>{STANDARD_STUDENT_CLASSES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}</select></label><label className="text-sm font-medium">Status<select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className="mt-1 w-full border rounded-lg p-2.5"><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option></select></label></div><button type="button" onClick={() => setShowPassword(!showPassword)} className="text-xs text-aksara-600 mt-3">{showPassword ? 'Sembunyikan password' : 'Lihat password'}</button><div className="flex justify-end gap-3 mt-6"><button type="button" onClick={closeModal} className="px-4 py-2 bg-gray-100 rounded-lg">Batal</button><button type="submit" disabled={savingStudent} className="px-4 py-2 bg-aksara-600 text-white rounded-lg disabled:opacity-60 disabled:cursor-not-allowed">{savingStudent ? 'Menyimpan...' : 'Simpan Murid'}</button></div></form></div>}
                </div>
            );
        };

        const AdminParents = () => {
            useAksaraDataRefresh();
            const [parents, setParents] = React.useState(() => readDurableCollection('parents').map(p => ({ ...p })));
            const [selectedSchool, setSelectedSchool] = React.useState('');
            const [modal, setModal] = React.useState(null);
            const [editingId, setEditingId] = React.useState(null);
            const [showPassword, setShowPassword] = React.useState(false);
            const [error, setError] = React.useState('');
            const [notice, setNotice] = React.useState('');
            const [refreshKey, setRefreshKey] = React.useState(0);
            const blank = { schoolId: '', studentId: '', name: '', relationship: 'WALI', studentNisn: '', phone: '', address: '', status: 'ACTIVE', username: '', password: '' };
            const [form, setForm] = React.useState(blank);

            const schools = React.useMemo(() => {
                const list = typeof getRegisteredSchools === 'function' ? getRegisteredSchools() : mergeCollectionRecords('schools');
                const unique = new Map();
                (list || []).forEach(s => { if (s && s.id && (s.name || s.schoolName)) unique.set(String(s.id), { ...s, name: s.name || s.schoolName }); });
                return [...unique.values()];
            }, [refreshKey, DEMO_DB.schools?.length, DEMO_DB.users?.length]);

            React.useEffect(() => {
                const onChange = () => setRefreshKey(v => v + 1);
                window.addEventListener('aksara:firebase-changed', onChange);
                window.addEventListener('aksara:schools-changed', onChange);
                window.addEventListener('aksara:students-changed', onChange);
                return () => {
                    window.removeEventListener('aksara:firebase-changed', onChange);
                    window.removeEventListener('aksara:schools-changed', onChange);
                    window.removeEventListener('aksara:students-changed', onChange);
                };
            }, []);

            React.useEffect(() => {
                if (!selectedSchool && schools.length) setSelectedSchool(schools[0].id);
                if (selectedSchool && !schools.some(s => String(s.id) === String(selectedSchool))) setSelectedSchool(schools[0]?.id || '');
            }, [schools, selectedSchool]);

            React.useEffect(() => {
                const source = readDurableCollection('parents');
                const unique = []; const byStudent = new Map();
                source.forEach(p => {
                    const studentKey = String(p.studentId || p.studentNisn || p.nisn || p.id || '').trim().toLowerCase();
                    if (!studentKey) { unique.push({ ...p }); return; }
                    if (byStudent.has(studentKey)) {
                        const idx = byStudent.get(studentKey);
                        const merged = { ...unique[idx] };
                        Object.keys(p).forEach(k => { if ((merged[k] === undefined || merged[k] === null || merged[k] === '') && p[k] !== '') merged[k] = p[k]; });
                        unique[idx] = merged;
                    } else { byStudent.set(studentKey, unique.length); unique.push({ ...p }); }
                });
                setParents(unique);
                persistDurableCollection('parents', unique);
            }, [refreshKey, DEMO_DB.parents?.length]);

            const allStudents = React.useMemo(() => (typeof getRegisteredStudents === 'function' ? getRegisteredStudents() : mergeCollectionRecords('students')).map(s => ({ ...s })), [refreshKey, DEMO_DB.students?.length, DEMO_DB.users?.length]);
            const students = React.useMemo(() => {
                if (!form.schoolId) return [];
                const selected = schools.find(sc => String(sc.id) === String(form.schoolId));
                const selectedName = String(selected?.name || selected?.schoolName || '').trim().toLowerCase();
                return allStudents.filter(s => {
                    const sid = String(s.schoolId || s.sekolahId || '').trim();
                    const sname = String(s.schoolName || s.sekolahName || s.asalSekolah || '').trim().toLowerCase();
                    return sid === String(form.schoolId) || (!sid && selectedName && sname === selectedName);
                });
            }, [allStudents, form.schoolId, schools]);

            const rows = React.useMemo(() => parents.map(p => {
                const relation = (DEMO_DB.parent_student || []).find(r => String(r.parentId) === String(p.id));
                return relation ? { ...p, studentId: p.studentId || relation.studentId, relationship: p.relationship || relation.relationship } : p;
            }).filter(p => {
                const student = allStudents.find(s => String(s.id) === String(p.studentId));
                return !selectedSchool || String(student?.schoolId || p.schoolId || '') === String(selectedSchool);
            }), [parents, allStudents, selectedSchool, refreshKey]);

            const openModal = (parent = null) => {
                const student = parent && allStudents.find(s => String(s.id) === String(parent.studentId || parent.studentId));
                const schoolId = student?.schoolId || student?.sekolahId || parent?.schoolId || selectedSchool || schools[0]?.id || '';
                setEditingId(parent?.id || null);
                setForm(parent ? {
                    ...blank,
                    ...parent,
                    schoolId,
                    studentId: student?.id || parent.studentId || '',
                    studentNisn: parent.studentNisn || student?.nisn || '',
                    name: parent.name || student?.parentName || '',
                    relationship: parent.relationship || 'WALI',
                    username: parent.username || (student?.nisn ? `OT-${student.nisn}` : ''),
                    password: parent.password || (student?.nisn ? `OT-${student.nisn}` : '')
                } : { ...blank, schoolId, studentId: '', studentNisn: '' });
                setShowPassword(false); setError(''); setModal(true);
            };
            const closeModal = () => { setModal(null); setEditingId(null); setError(''); };

            const chooseStudent = (id) => {
                const student = allStudents.find(s => String(s.id) === String(id) || String(s.studentId || '') === String(id));
                if (!student) {
                    setForm(prev => ({ ...prev, studentId: '', studentNisn: '', name: '', username: '', password: '' }));
                    return;
                }
                const existing = parents.find(p => String(p.studentId) === String(id) && p.id !== editingId);
                const parentName = student.parentName || '';
                const studentNisn = student.nisn || student.nis || '';
                setForm(prev => ({
                    ...prev,
                    studentId: student.id,
                    schoolId: student.schoolId || prev.schoolId,
                    studentNisn,
                    name: prev.name || parentName,
                    username: prev.username || (studentNisn ? `OT-${studentNisn}` : ''),
                    password: prev.password || (studentNisn ? `OT-${studentNisn}` : ''),
                    address: prev.address || student.parentAddress || '',
                    phone: prev.phone || student.parentPhone || ''
                }));
                if (existing && !editingId) setNotice('Murid ini sudah memiliki data wali. Anda dapat mengedit data wali yang tersedia.');
            };

            const save = (e) => {
                e.preventDefault();
                const student = allStudents.find(s => {
                    if (String(s.id) !== String(form.studentId) && String(s.studentId || '') !== String(form.studentId)) return false;
                    const sid = String(s.schoolId || s.sekolahId || '').trim();
                    const selected = schools.find(sc => String(sc.id) === String(form.schoolId));
                    const sname = String(s.schoolName || s.sekolahName || s.asalSekolah || '').trim().toLowerCase();
                    const selectedName = String(selected?.name || selected?.schoolName || '').trim().toLowerCase();
                    return sid === String(form.schoolId) || (!sid && selectedName && sname === selectedName);
                });
                if (!form.schoolId) return setError('Sekolah wajib dipilih.');
                if (!student) return setError('Pilih murid yang tersedia sesuai sekolah yang dipilih.');
                if (!form.name.trim()) return setError('Nama Orang Tua/Wali wajib diisi.');
                const duplicate = parents.find(p => String(p.studentId) === String(student.id) && p.id !== editingId);
                if (duplicate && !editingId) return setError('Murid ini sudah memiliki data orang tua/wali. Edit data yang tersedia.');
                const studentNisn = student.nisn || student.nis || '';
                const next = {
                    ...form,
                    id: editingId || `PAR-${Date.now()}`,
                    studentId: student.id,
                    schoolId: student.schoolId || form.schoolId,
                    schoolName: getSchoolName(student.schoolId || form.schoolId),
                    studentName: student.name || '',
                    studentNisn,
                    name: form.name.trim(),
                    username: form.username || `OT-${studentNisn}`,
                    password: form.password || `OT-${studentNisn}`
                };
                let updated = editingId ? parents.map(p => p.id === editingId ? next : p) : [...parents, next];
                const byStudent = new Map();
                updated.forEach(p => {
                    const key = String(p.studentId || p.studentNisn || p.nisn || p.id || '').trim().toLowerCase();
                    if (!key) { byStudent.set(`id:${p.id}`, p); return; }
                    const existing = byStudent.get(key);
                    byStudent.set(key, existing ? { ...existing, ...p } : p);
                });
                updated = [...byStudent.values()];
                setParents(updated);
                DEMO_DB.parents = updated;
                persistDurableCollection('parents', updated);
                const parentUser = {
                    id: next.id, userId: next.id, parentId: next.id, studentId: next.studentId,
                    username: next.username, password: next.password, name: next.name,
                    email: next.email || '', schoolId: next.schoolId, schoolName: next.schoolName,
                    role: 'ORANG_TUA', status: next.status || 'ACTIVE',
                    permissions: ['VIEW_DASHBOARD','VIEW_CHILD_RESULTS'], updatedAt: new Date().toISOString()
                };
                DEMO_DB.users = [...mergeCollectionRecords('users').filter(u => String(u.id || u.userId || u.parentId || '') !== String(parentUser.id)), parentUser];
                persistDurableCollection('users', DEMO_DB.users);
                DEMO_DB.parent_student = (DEMO_DB.parent_student || []).filter(r => r.parentId !== next.id);
                DEMO_DB.parent_student.push({ parentId: next.id, studentId: student.id, relationship: next.relationship || 'WALI' });
                persistDurableCollection('parent_student', DEMO_DB.parent_student);
                DEMO_DB.students = (DEMO_DB.students || []).map(s => String(s.id) === String(student.id) ? { ...s, parentName: next.name, parentId: next.id, parentSchoolId: next.schoolId } : s);
                persistDurableCollection('students', DEMO_DB.students);
                // Sinkronkan perubahan wali dan relasinya ke Firebase.
                Promise.all([
                    aksaraFbPersistCollection('parents', DEMO_DB.parents),
                    aksaraFbPersistCollection('parent_student', DEMO_DB.parent_student),
                    aksaraFbPersistCollection('students', DEMO_DB.students),
                    aksaraFbPersistCollection('users', DEMO_DB.users),
                    aksaraFbProvisionSecondaryAccount(parentUser, 'ORANG_TUA', 'USR-OT')
                ]).catch(err => console.warn('[AKSARA] Sinkronisasi wali gagal:', err));
                window.dispatchEvent(new CustomEvent('aksara:students-changed'));
                window.dispatchEvent(new CustomEvent('aksara:parents-changed'));
                closeModal();
                setNotice(editingId ? 'Data orang tua/wali berhasil diperbarui.' : 'Data orang tua/wali berhasil disimpan.');
                setTimeout(() => setNotice(''), 3000);
            };

            React.useEffect(() => { const onKey = e => e.key === 'Escape' && closeModal(); window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

            return <div className="space-y-6">
                <div className="flex justify-between items-center"><div><h2 className="text-2xl font-heading font-bold text-gray-900">Data Orang Tua/Wali</h2><p className="text-gray-500 text-sm">Data wali terhubung dengan murid dan sekolah yang terdaftar.</p></div><button onClick={() => openModal()} className="px-4 py-2 bg-aksara-600 text-white rounded-lg hover:bg-aksara-900">Tambah Orang Tua/Wali</button></div>
                {notice && <div role="status" className="p-3 rounded-lg border border-teal-200 bg-teal-50 text-teal-700">{notice}</div>}
                <label className="text-sm font-medium">Sekolah<select value={selectedSchool} onChange={e => setSelectedSchool(e.target.value)} className="ml-2 border rounded-lg p-2"><option value="">Semua Sekolah</option>{schools.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></label>
                <div className="bg-white rounded-xl border overflow-x-auto"><table className="w-full text-left"><thead><tr className="bg-gray-50 text-xs uppercase text-gray-500"><th className="p-4">No</th><th className="p-4">Nama Wali</th><th className="p-4">Nama Murid</th><th className="p-4">NISN</th><th className="p-4">Hubungan</th><th className="p-4">Username</th><th className="p-4">Aksi</th></tr></thead><tbody className="divide-y">{rows.map((p,i) => { const s=allStudents.find(x=>String(x.id)===String(p.studentId)); return <tr key={p.id}><td className="p-4">{i+1}</td><td className="p-4 font-semibold">{p.name}</td><td className="p-4">{s?.name || p.studentName || '-'}</td><td className="p-4 font-mono">{p.studentNisn || s?.nisn || '-'}</td><td className="p-4">{p.relationship || '-'}</td><td className="p-4 font-mono">{p.username || `OT-${s?.nisn || ''}`}</td><td className="p-4"><div className="flex justify-end gap-2"><button onClick={() => openModal(p)} className="px-2 py-1 text-xs text-aksara-600 border rounded">Edit</button><button onClick={() => removeParent(p)} className="px-2 py-1 text-xs text-red-600 border border-red-200 rounded hover:bg-red-50">Hapus</button></div></td></tr>})}{rows.length===0 && <tr><td colSpan="7" className="p-10 text-center text-gray-500">Belum ada data orang tua/wali. <button onClick={() => openModal()} className="text-aksara-600 font-medium">Tambah sekarang</button></td></tr>}</tbody></table></div>
                {modal && <div role="dialog" aria-modal="true" onClick={closeModal} className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-gray-900/50"><form onSubmit={save} onClick={e => e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto"><div className="flex justify-between items-center mb-5"><h3 className="text-xl font-bold">{editingId ? 'Edit Orang Tua/Wali' : 'Tambah Orang Tua/Wali'}</h3><button type="button" onClick={closeModal} aria-label="Tutup" className="text-2xl text-gray-500">×</button></div>{error && <div className="mb-4 p-3 rounded-lg bg-red-50 text-red-700">{error}</div>}

                </>}

        const getCurrentAcademicYearName = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const startYear = month >= 7 ? year : year - 1;
            return `${startYear}/${startYear + 1}`;
        };
        const ensureCurrentAcademicYearActive = () => {
            const currentName = getCurrentAcademicYearName();
            let years = Array.isArray(DEMO_DB.academicYears) ? DEMO_DB.academicYears : [];
            const current = years.find(y => String(y.name || '').trim() === currentName);
            if (current) {
                const next = years.map(y => ({ ...y, status: y.id === current.id ? 'ACTIVE' : 'INACTIVE' }));
                if (JSON.stringify(next) !== JSON.stringify(years)) DEMO_DB.academicYears = next;
                return next;
            }
            if (!years.some(y => String(y.status || '').toUpperCase() === 'ACTIVE')) {
                const created = { id: `AY-${Date.now()}`, name: currentName, status: 'ACTIVE' };
                years = [...years, created];
                DEMO_DB.academicYears = years;
            }
            return years;
        };
        const getRegisteredSubjects = () => {
            const sources = [
                ...mergeCollectionRecords('subjects'),
                ...readDurableCollection('subjects'),
                ...readLocalCollection('firebase_subjects')
            ];
            // Satu mata pelajaran = satu entri. Data dari Firebase/local dapat memiliki
            // ID berbeda untuk nama mapel yang sama, sehingga deduplikasi harus memakai
            // nama mapel sebagai kunci utama, bukan hanya ID.
            const byName = new Map();
            const byId = new Map();
            sources.forEach(item => {
                if (!item || !(item.id || item.subjectId) || !(item.name || item.subjectName || item.nama)) return;
                const id = String(item.id || item.subjectId).trim();
                const name = String(item.name || item.subjectName || item.nama).trim();
                if (!id || !name || String(item.status || 'ACTIVE').toUpperCase() === 'INACTIVE') return;
                const nameKey = name.toLocaleLowerCase('id-ID').replace(/\s+/g, ' ').trim();
                const existing = byName.get(nameKey);
                if (!existing) {
                    const record = { ...item, id, name };
                    byName.set(nameKey, record);
                    byId.set(id, record);
                } else {
                    // Pertahankan satu ID kanonik, tetapi lengkapi metadata dari record lain.
                    const merged = { ...existing, ...item, id: existing.id, name: existing.name };
                    byName.set(nameKey, merged);
                    byId.set(existing.id, merged);
                }
            });
            return [...byName.values()].sort((a, b) => String(a.name).localeCompare(String(b.name), 'id', { sensitivity: 'base' }));
        };
        const resolveRegisteredSubjectId = value => {
            const raw = String(value ?? '').trim();
            if (!raw) return '';
            const subjects = getRegisteredSubjects();
            const exact = subjects.find(s => String(s.id) === raw);
            if (exact) return exact.id;
            // Jika ID lama/duplikat tidak lagi tampil di dropdown, cari nama aslinya
            // dari seluruh sumber lalu kembalikan ID kanonik dari daftar terdeduplikasi.
            const sources = [
                ...mergeCollectionRecords('subjects'),
                ...readDurableCollection('subjects'),
                ...readLocalCollection('firebase_subjects')
            ];
            const source = sources.find(item => String(item?.id || item?.subjectId || '').trim() === raw);
            const sourceName = String(source?.name || source?.subjectName || source?.nama || '').trim().toLocaleLowerCase('id-ID').replace(/\s+/g, ' ');
            if (sourceName) {
                const canonical = subjects.find(s => String(s.name || '').trim().toLocaleLowerCase('id-ID').replace(/\s+/g, ' ') === sourceName);
                if (canonical) return canonical.id;
            }
            const byName = subjects.find(s => String(s.name || '').trim().toLocaleLowerCase('id-ID').replace(/\s+/g, ' ') === raw.toLocaleLowerCase('id-ID').replace(/\s+/g, ' '));
            return byName?.id || raw;

        const getRegisteredClasses = () => {
            const sources = [
                ...(Array.isArray(DEMO_DB.classes) ? DEMO_DB.classes : []),

            ];

                const value = String(student?.classId || student?.className || student?.class || student?.kelas || '').trim();
                const name = String(student?.className || student?.class || student?.kelas || value).trim();
                if (value || name) sources.push({ id: value || name, name: name || value, schoolId: student?.schoolId || student?.sekolahId || '', status: student?.status || 'ACTIVE' });
            });
            const bySchoolName = new Map();
            sources.forEach(item => {
                if (!item) return;
                if (String(item.status || 'ACTIVE').toUpperCase() === 'INACTIVE') return;
                const id = String(item.id || item.classId || '').trim();
                const name = String(item.name || item.className || item.grade || item.kelas || id).trim();
                if (!id && !name) return;
                const schoolId = String(item.schoolId || item.sekolahId || '').trim();

                    bySchoolName.set(key, { ...existing, ...item, id: existing.id, name: existing.name, schoolId: existing.schoolId || schoolId });
                }
            });
            return [...bySchoolName.values()].sort((a,b) => String(a.name).localeCompare(String(b.name), 'id', { numeric: true, sensitivity: 'base' }));
        };

        const resolveSubjectId = value => resolveRegisteredSubjectId(value);
        const resolveClassId = value => {

            if (!raw) return '';
            const classes = getRegisteredClasses();
            const exact = classes.find(c => String(c.id) === raw);
            if (exact) return exact.id;

            const exact = (DEMO_DB.academicYears || []).find(y => String(y.id) === raw);

            return byName?.id || raw;
        };
        const normalizeQuestionMetadata = question => {
            if (!question) return question;
            const subjectId = resolveSubjectId(question.subjectId || question.subjectName || '');
            const classId = resolveClassId(question.classId || question.className || '');
            const academicYearId = resolveAcademicYearId(question.academicYearId || question.academicYearName || '');

        };

        const AdminAcademicYears = () => {
            const [years,setYears]=React.useState(() => ensureCurrentAcademicYearActive()); const [open,setOpen]=React.useState(false); const [name,setName]=React.useState(''); const [notice,setNotice]=React.useState(''); const [confirmYear,setConfirmYear]=React.useState(null); const [backupPreview,setBackupPreview]=React.useState(null); const [backupMode,setBackupMode]=React.useState('merge');
            const importBackup = async (event) => {
                const file = event.target.files?.[0]; event.target.value = ''; if (!file) return;
                if (file.type !== 'application/json' && !file.name.toLowerCase().endsWith('.json')) { setNotice('Unggah file JSON backup yang valid.'); return; }
                try {
                    const payload = JSON.parse(await file.text());
                    if (!payload || typeof payload !== 'object' || !payload.academicYear || !Array.isArray(payload.classes) || !Array.isArray(payload.students)) throw new Error('Struktur backup tidak dikenali.');
                    setBackupPreview({ payload, counts: { sekolah: payload.schools?.length || 0, kelas: payload.classes.length, murid: payload.students.length, guru: payload.teachers?.length || 0, wali: payload.parents?.length || 0, mataPelajaran: payload.subjects?.length || 0, asesmen: payload.assessments?.length || 0, soal: payload.questions?.length || 0 } });
                } catch (error) { setNotice(`Backup tidak dapat dibaca: ${error.message}`); }
            };
            const commitBackup = () => {
                if (!backupPreview) return; const { payload } = backupPreview; const mergeById = (key, incoming) => { const current = DEMO_DB[key] || []; const ids = new Set(current.map(x => x.id)); const added = incoming.filter(x => x && !ids.has(x.id)); DEMO_DB[key] = [...current, ...added]; return added.length; };
                if (backupMode === 'merge') { ['schools','teachers','students','parents','subjects','questions','examSchedules'].forEach(key => mergeById(key, payload[key] || payload.assessments || [])); mergeById('classes', payload.classes || []); }
                const ay = payload.academicYear; if (!DEMO_DB.academicYears.some(y => y.name === ay.name)) DEMO_DB.academicYears = [...DEMO_DB.academicYears, { ...ay, id: ay.id || `AY-${Date.now()}`, status: 'INACTIVE' }]; setYears([...DEMO_DB.academicYears]); setBackupPreview(null); setNotice(`Backup ${ay.name} berhasil digabung tanpa menghapus data lama.`);
            };
            const activate=id=>{const next=years.map(y=>({...y,status:y.id===id?'ACTIVE':'INACTIVE'}));setYears(next);DEMO_DB.academicYears=next;setNotice('Tahun Ajaran aktif diperbarui.');};
            const downloadBackup=(year)=>{const classes=DEMO_DB.classes.filter(c=>c.academicYearId===year.id);const students=DEMO_DB.students.filter(s=>classes.some(c=>c.id===s.classId));const parents=DEMO_DB.parents.filter(p=>students.some(s=>s.id===p.studentId));const teachers=DEMO_DB.teachers.filter(t=>classes.some(c=>c.homeroomTeacherId===t.id));const payload={backupVersion:1,createdAt:new Date().toISOString(),academicYear:year,schools:DEMO_DB.schools.filter(s=>classes.some(c=>c.schoolId===s.id)),classes,students,parents,teachers,subjects:DEMO_DB.subjects,assessments:DEMO_DB.examSchedules.filter(x=>classes.some(c=>c.id===x.classId))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`aksara-backup-${year.name.replace(/[^0-9A-Za-z]+/g,'-')}.json`;a.click();URL.revokeObjectURL(url);setNotice(`Backup ${year.name} siap diunduh.`);};
