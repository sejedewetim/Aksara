                {editing && <div role="dialog" aria-modal="true" className="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-gray-900/50"><form onSubmit={save} className="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[92vh] overflow-y-auto p-6"><div className="flex justify-between items-center mb-5"><div><h3 className="text-xl font-bold">{viewOnly ? 'Lihat Paket Ujian' : editing.id && packages.some(p => p.id === editing.id) ? 'Edit Paket Ujian' : 'Buat Paket Ujian'}</h3><p className="text-sm text-gray-500 mt-1">Pilih soal langsung dari Bank Soal.</p></div><button type="button" onClick={close} className="text-2xl text-gray-400">×</button></div>
                    {error && <div role="alert" className="mb-4 p-3 rounded-lg bg-red-50 text-red-700">{error}</div>}
                    <div className="grid md:grid-cols-2 gap-4"><label className="text-sm font-medium">Nama Paket<input disabled={viewOnly} required value={editing.name || ''} onChange={e => setEditing({...editing,name:e.target.value})} placeholder="Contoh: Try Out TKA Matematika Kelas VI" className="mt-1 w-full border rounded-lg p-2.5 disabled:bg-gray-50"/></label><label className="text-sm font-medium">Mata Pelajaran<select disabled={viewOnly} required value={editing.subjectId || ''} onChange={e => setEditing({...editing,subjectId:e.target.value,questionIds:[]})} className="mt-1 w-full border rounded-lg p-2.5 disabled:bg-gray-50"><option value="">Pilih mata pelajaran</option>{subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></label><div className="text-sm font-medium"><label>Target Kelas<select disabled={viewOnly} value={editing.classMode || 'ALL'} onChange={e=>setEditing({...editing,classMode:e.target.value,classIds:e.target.value==='ALL'?[]:(editing.classIds||[])})} className="mt-1 w-full border rounded-lg p-2.5 disabled:bg-gray-50"><option value="ALL">Semua Kelas</option><option value="SELECTED">Beberapa Kelas</option></select></label>{editing.classMode==='SELECTED' && <div className="mt-2 border rounded-lg p-2.5 max-h-48 overflow-y-auto space-y-1">{availableClasses.map(c=><label key={c.id} className="flex items-center gap-2 text-sm"><input disabled={viewOnly} type="checkbox" checked={(editing.classIds||[]).includes(c.id)} onChange={e=>setEditing({...editing,classIds:e.target.checked?[...(editing.classIds||[]),c.id]:(editing.classIds||[]).filter(id=>id!==c.id)})}/><span>{c.name || c.grade || c.id}</span></label>)}</div>}</div><label className="text-sm font-medium">Durasi Pengerjaan (menit)<input disabled={viewOnly} type="number" min="1" value={editing.duration || 60} onChange={e => setEditing({...editing,duration:e.target.value})} className="mt-1 w-full border rounded-lg p-2.5 disabled:bg-gray-50"/></label><label className="text-sm font-medium">Status<select disabled={viewOnly} value={editing.status || 'DRAFT'} onChange={e => setEditing({...editing,status:e.target.value})} className="mt-1 w-full border rounded-lg p-2.5 disabled:bg-gray-50"><option value="DRAFT">Draf</option><option value="READY">Siap Digunakan</option><option value="PUBLISHED">Dipublikasikan</option></select></label><label className="flex items-center gap-2 text-sm font-medium mt-6"><input disabled={viewOnly} type="checkbox" checked={editing.randomize !== false} onChange={e => setEditing({...editing,randomize:e.target.checked})}/> Acak urutan soal</label></div>
                    <div className="mt-6 border rounded-xl overflow-hidden"><div className="p-4 bg-gray-50 border-b"><div className="flex flex-col md:flex-row gap-3 justify-between md:items-center"><div><h4 className="font-semibold">Pilih Soal dari Bank Soal</h4><p className="text-xs text-gray-500">{selectedIds.size} soal dipilih{editing.subjectId ? ' untuk mata pelajaran ini' : ''}.</p></div><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Cari kode, topik, atau teks soal..." className="border rounded-lg p-2 text-sm w-full md:w-80"/></div>{!viewOnly && <div className="flex gap-3 mt-3 text-xs"><button type="button" onClick={selectAllVisible} className="text-aksara-600">Pilih semua hasil</button><button type="button" onClick={clearVisible} className="text-red-600">Hapus pilihan hasil</button></div>}</div><div className="max-h-72 overflow-y-auto divide-y">{visibleGroups.map((group,i)=>{const first=group[0];const groupKey=getQuestionBackupGroupKey(first);const groupLabel=getQuestionBackupGroupLabel(first,groupKey);const selectedCount=group.filter(q=>selectedIds.has(q.id)).length;const allSelected=selectedCount===group.length;return <label key={groupKey||`group-${i}`} className="flex gap-3 p-4 hover:bg-gray-50 cursor-pointer"><input disabled={viewOnly} type="checkbox" checked={allSelected} ref={el=>{if(el)el.indeterminate=selectedCount>0&&!allSelected;}} onChange={()=>toggleQuestionGroup(group)} className="mt-1"/><div className="min-w-0 flex-1"><div className="flex items-center justify-between gap-3"><div><div className="text-xs font-mono text-aksara-600">Kode/Paket: {groupLabel}</div><div className="text-sm font-semibold text-gray-900 mt-1">{group.length} soal dalam satu kelompok</div></div><span className="text-xs rounded-full px-2 py-1 bg-gray-100 text-gray-600">{selectedCount}/{group.length} dipilih</span></div><div className="mt-2 space-y-1">{group.slice(0,3).map((q,j)=><div key={q.id} className="text-xs text-gray-600 truncate">{j+1}. {q.text || 'Tanpa teks soal'} <span className="text-gray-400">({q.code||q.id})</span></div>)}{group.length>3&&<div className="text-xs text-gray-400">+ {group.length-3} soal lainnya</div>}</div></div></label>})}{!visibleGroups.length && <div className="p-8 text-center text-sm text-gray-500">Belum ada soal yang sesuai. Pilih mata pelajaran atau tambahkan soal terlebih dahulu di Bank Soal.</div>}</div></div>
                    <div className="flex justify-end gap-3 mt-6"><button type="button" onClick={close} className="px-4 py-2 bg-gray-100 rounded-lg">Tutup</button>{!viewOnly && <button type="submit" className="px-4 py-2 bg-aksara-600 text-white rounded-lg">Simpan Paket</button>}</div>
                </form></div>}
            </div>;
        };

        const LegacyAdminExamSchedules = () => {
            const { setRoute } = React.useContext(AppContext);
            return (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-2xl font-heading font-bold text-gray-900">Jadwal Ujian</h2>
                            <p className="text-gray-500 text-sm">Kelola tanggal, durasi, dan akses peserta.</p>
                        </div>
                        <button className="px-4 py-2 bg-aksara-600 rounded-lg text-sm font-medium text-white hover:bg-aksara-900 flex items-center gap-2">
                            <Icon name="calendar-plus" className="w-4 h-4"/> Buat Jadwal Baru
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-50/50 border-b border-gray-200 text-xs uppercase text-gray-500 font-semibold">
                                    <th className="px-6 py-4">Informasi Ujian</th>
                                    <th className="px-6 py-4">Waktu</th>
                                    <th className="px-6 py-4">Status</th>
                                    <th className="px-6 py-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 text-sm">
                                {DEMO_DB.examSchedules.map(sched => (
                                    <tr key={sched.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4 font-bold text-gray-900">{sched.name}</td>
                                        <td className="px-6 py-4 text-xs text-gray-600">{sched.duration} Menit</td>
                                        <td className="px-6 py-4"><span className="px-2.5 py-1 rounded-full text-xs font-medium bg-teal-100 text-teal-800">OPEN</span></td>
                                        <td className="px-6 py-4 text-right">
                                            <button onClick={() => setRoute('admin/monitoring')} className="px-3 py-1.5 text-xs font-medium text-aksara-600 bg-indigo-50 rounded border">Live Monitor</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )
        };

        const MANUAL_CORRECTIONS_KEY = 'aksara_manual_corrections';
        const readManualCorrections = () => { try { const value = JSON.parse(localStorage.getItem(MANUAL_CORRECTIONS_KEY) || '[]'); return Array.isArray(value) ? value : []; } catch (e) { return []; } };
        const saveManualCorrection = (record) => { const current = readManualCorrections(); const key = [record.scheduleId, record.studentId, record.packageId, record.questionId].join('|'); const next = [...current.filter(item => [item.scheduleId, item.studentId, item.packageId, item.questionId].join('|') !== key), { ...record, updatedAt: new Date().toISOString() }]; localStorage.setItem(MANUAL_CORRECTIONS_KEY, JSON.stringify(next)); return next; };
        const getQuestionScore = (question, answer, correction) => { const automatic = correction?.automaticScore ?? (question?.type === 'MULTIPLE_CHOICE' && question.correctAnswer?.includes(answer) ? (question.weight || 1) : 0); return correction?.isManualOverride ? Number(correction.manualScore || 0) : automatic; };
        const FilterDropdown = ({ label, options, value, onChange, placeholder }) => {
            const [open, setOpen] = React.useState(false);
            const ref = React.useRef(null);
            React.useEffect(() => { const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('mousedown', close); return () => document.removeEventListener('mousedown', close); }, []);
            const selected = options.filter(option => value.includes(option.id));
            const summary = selected.length === 0 ? placeholder : selected.length === 1 ? selected[0].name : `${selected.length} dipilih`;
            return <div ref={ref} className="relative min-w-0 flex-1"><label className="block text-xs font-semibold text-gray-600 mb-1">{label}</label><button type="button" onClick={() => setOpen(prev => !prev)} aria-expanded={open} className="w-full min-h-10 px-3 py-2 bg-white border border-gray-300 rounded-lg text-left text-sm flex items-center justify-between gap-2 hover:border-aksara-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"><span className="truncate">{summary}</span><Icon name="chevron-down" className="w-4 h-4 shrink-0 text-gray-400" /></button>{open && <div className="absolute left-0 right-0 mt-1 z-50 max-h-56 overflow-y-auto rounded-lg border border-gray-200 bg-white p-2 shadow-xl">{options.length ? options.map(option => <label key={option.id} className="flex items-center gap-2 rounded-md px-2 py-2 text-sm hover:bg-indigo-50 cursor-pointer"><input type="checkbox" checked={value.includes(option.id)} onChange={() => onChange(value.includes(option.id) ? value.filter(id => id !== option.id) : [...value, option.id])} className="rounded text-aksara-600 focus:ring-aksara-600" /><span className="truncate">{option.name}</span></label>) : <p className="p-2 text-xs text-gray-500">Tidak ada opsi tersedia</p>}</div>}</div>;
        };

        const AdminMonitoring = () => {
            const { user } = React.useContext(AppContext);
            const teacher = getTeacherForUser(user);
            const isAdmin = String(user?.role || '').toUpperCase() === 'ADMIN_SUPER';
            const teacherSchoolId = String(teacher?.schoolId || user?.schoolId || user?.sekolahId || '').trim();
            const inferredSchoolIds = React.useMemo(() => {
                if (isAdmin) return (DEMO_DB.schools || []).map(s => String(s.id));
                if (teacherSchoolId) return [teacherSchoolId];
                const tid = String(teacher?.id || user?.teacherId || '').trim();
                const fromClasses = (DEMO_DB.classes || []).filter(c => String(c.homeroomTeacherId || '') === tid).map(c => String(c.schoolId || '')).filter(Boolean);
                const fromStudents = (DEMO_DB.students || []).map(s => String(s.schoolId || s.sekolahId || '')).filter(Boolean);
                return [...new Set([...fromClasses, ...fromStudents])];
            }, [isAdmin, teacherSchoolId, teacher?.id, user?.teacherId, DEMO_DB.schools?.length, DEMO_DB.classes?.length, DEMO_DB.students?.length]);
            const [selectedSchools, setSelectedSchools] = React.useState(isAdmin ? [] : inferredSchoolIds);
            const [selectedSubjects, setSelectedSubjects] = React.useState([]);
            const [refreshKey, setRefreshKey] = React.useState(0);
            React.useEffect(() => {
                setSelectedSchools(isAdmin ? [] : inferredSchoolIds);
            }, [isAdmin, inferredSchoolIds.join('|')]);
            React.useEffect(() => {
                const refresh = () => setRefreshKey(v => v + 1);
                window.addEventListener('aksara:firebase-changed', refresh);
                window.addEventListener('aksara:schedules-changed', refresh);
                const timer = setInterval(refresh, 3000);
                return () => { clearInterval(timer); window.removeEventListener('aksara:firebase-changed', refresh); window.removeEventListener('aksara:schedules-changed', refresh); };
            }, []);

            const schools = React.useMemo(() => (typeof getRegisteredSchools === 'function' ? getRegisteredSchools() : (DEMO_DB.schools || [])).filter(Boolean), [refreshKey, DEMO_DB.schools?.length, localStorage.getItem('aksara_schools')]);
            const schoolMap = React.useMemo(() => new Map(schools.map(s => [String(s.id), s])), [schools]);
            const schedules = React.useMemo(() => (DEMO_DB.examSchedules || []).filter(Boolean), [refreshKey, DEMO_DB.examSchedules?.length]);
            const packages = React.useMemo(() => (DEMO_DB.examPackages || []).filter(Boolean), [refreshKey, DEMO_DB.examPackages?.length]);
            const participants = React.useMemo(() => (DEMO_DB.examParticipants || []).filter(Boolean), [refreshKey, DEMO_DB.examParticipants?.length]);
            const attempts = React.useMemo(() => (DEMO_DB.examAttempts || []).filter(Boolean), [refreshKey, DEMO_DB.examAttempts?.length]);
            const results = React.useMemo(() => (DEMO_DB.examResults || []).filter(Boolean), [refreshKey, DEMO_DB.examResults?.length]);
            const students = React.useMemo(() => (DEMO_DB.students || []).filter(Boolean), [refreshKey, DEMO_DB.students?.length]);
            const subjects = React.useMemo(() => (typeof mergeCollectionRecords === 'function' ? mergeCollectionRecords('subjects') : (DEMO_DB.subjects || [])).filter(Boolean), [refreshKey, DEMO_DB.subjects?.length]);
            const classes = React.useMemo(() => (DEMO_DB.classes || []).filter(Boolean), [refreshKey, DEMO_DB.classes?.length]);

            const registeredSchoolIds = React.useMemo(() => new Set(schools.map(s => String(s.id))), [schools]);
            const accessibleSchoolIds = React.useMemo(() => new Set((isAdmin ? schools.map(s => String(s.id)) : inferredSchoolIds).filter(id => registeredSchoolIds.has(String(id)))), [isAdmin, schools, inferredSchoolIds.join('|'), registeredSchoolIds]);
            const schoolOptions = schools.filter(s => accessibleSchoolIds.has(String(s.id)));
            const selectedSchoolSet = new Set(selectedSchools);

            const getScheduleSchoolId = (schedule) => {
                const direct = String(schedule?.schoolId || schedule?.sekolahId || '').trim();
                if (direct) return direct;
                const classId = schedule?.classId || schedule?.targetClassId || (Array.isArray(schedule?.classIds) ? schedule.classIds[0] : '');
                const cls = classes.find(c => String(c.id) === String(classId));
                return String(cls?.schoolId || '').trim();
            };
            const getSchedulePackage = (schedule) => packages.find(p => String(p.id) === String(schedule?.packageId || schedule?.examId || schedule?.paketId));
            const normalizeSubjectName = (value) => String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const getScheduleSubjectName = (schedule) => {
                const pkg = getSchedulePackage(schedule);
                return String(schedule?.subjectName || schedule?.mapelName || schedule?.subject || schedule?.mapel || pkg?.subjectName || pkg?.mapelName || pkg?.subject || pkg?.mapel || '').trim();
            };
            const getScheduleSubjectId = (schedule) => {
                const pkg = getSchedulePackage(schedule);
                const directId = String(schedule?.subjectId || schedule?.mapelId || pkg?.subjectId || pkg?.mapelId || '').trim();
                if (directId) return directId;
                const name = normalizeSubjectName(getScheduleSubjectName(schedule));
                const matched = subjects.find(sub => normalizeSubjectName(sub?.name || sub?.subjectName || sub?.mapelName) === name);
                return String(matched?.id || matched?.subjectId || '').trim();
            };
            const activeScheduleStatuses = new Set(['OPEN','PUBLISHED','ACTIVE','IN_PROGRESS','SCHEDULED','UPCOMING']);
            const getScheduleSubjectKey = (schedule) => {
                const id = getScheduleSubjectId(schedule);
                if (id) return `ID:${id}`;
                const name = normalizeSubjectName(getScheduleSubjectName(schedule));
                return name ? `NAME:${name}` : '';
            };

            // Sekolah pada filter berasal langsung dari master data sekolah yang terdaftar.
            // Jadwal yang sekolahnya tidak terdaftar tidak ditampilkan di monitoring.
            const filteredSchedules = schedules.filter(schedule => {
                const status = String(schedule.status || schedule.publishStatus || '').toUpperCase();
                if (!activeScheduleStatuses.has(status)) return false;
                const sid = getScheduleSchoolId(schedule);
                return registeredSchoolIds.has(sid) && accessibleSchoolIds.has(sid) && (!selectedSchools.length || selectedSchoolSet.has(sid));
            });

            // Sekolah selalu berasal dari master sekolah terdaftar agar filter tetap dapat digunakan
            // walaupun belum ada jadwal ujian.
            // Mata pelajaran: jika belum ada jadwal, tampilkan semua mapel terdaftar. Setelah ada jadwal,
            // batasi pilihan hanya pada mapel yang benar-benar muncul di jadwal terfilter.
            const activeSchedules = schedules.filter(schedule => activeScheduleStatuses.has(String(schedule.status || schedule.publishStatus || '').toUpperCase()));
            const activeFilteredSchedules = activeSchedules.filter(schedule => {
                const sid = getScheduleSchoolId(schedule);
                return registeredSchoolIds.has(sid) && accessibleSchoolIds.has(sid) && (!selectedSchools.length || selectedSchoolSet.has(sid));
            });
            const scheduledSubjectKeys = new Set(activeFilteredSchedules.map(getScheduleSubjectKey).filter(Boolean));
            const subjectOptions = React.useMemo(() => {
                const out = [];
                const seen = new Set();
                activeFilteredSchedules.forEach(schedule => {
                    const key = getScheduleSubjectKey(schedule);
                    if (!key || seen.has(key)) return;
                    const subjectId = getScheduleSubjectId(schedule);
                    const subjectName = getScheduleSubjectName(schedule);
                    const master = subjects.find(sub => String(sub?.id || sub?.subjectId) === String(subjectId)) ||
                        subjects.find(sub => normalizeSubjectName(sub?.name || sub?.subjectName || sub?.mapelName) === normalizeSubjectName(subjectName));
                    const id = String(master?.id || master?.subjectId || subjectId || key).trim();
                    const name = String(master?.name || master?.subjectName || master?.mapelName || subjectName || '').trim();
                    if (!name) return;
                    seen.add(key);
                    out.push({ id, name, scheduleKey:key });
                });
                return out;
            }, [activeFilteredSchedules, subjects]);

            React.useEffect(() => {
                if (!schedules.length) return;
                setSelectedSubjects(prev => prev.filter(id => subjectOptions.some(option => String(option.id) === String(id) || option.scheduleKey === String(id))));
            }, [schedules.length, subjectOptions.map(x => `${x.id}|${x.scheduleKey}`).sort().join('|')]);

            const filteredSchedulesBySubject = filteredSchedules.filter(schedule => {
                const subjectId = getScheduleSubjectId(schedule);
                const subjectKey = getScheduleSubjectKey(schedule);
                return !selectedSubjects.length || selectedSubjects.includes(subjectId) || selectedSubjects.includes(subjectKey);
            });
            const relevantScheduleIds = new Set(filteredSchedulesBySubject.map(s => String(s.id || s.scheduleId || '')));

            // Baris monitoring dibentuk dari DATA MURID pada Admin Super, bukan hanya dari
            // examParticipants. Dengan demikian seluruh murid pada sekolah yang dijadwalkan
            // tetap tampil sebagai peserta meskipun belum memulai ujian.
            const scheduleTargetsStudent = (schedule, student) => {
                const studentSchoolId = String(student?.schoolId || student?.sekolahId || '').trim();
                const directSchoolId = getScheduleSchoolId(schedule);
                const scope = String(schedule?.schoolScope || '').toLowerCase();
                const schoolIds = (Array.isArray(schedule?.schoolIds) ? schedule.schoolIds : []).map(String);
                const schoolMatch = scope === 'all' || String(schedule?.schoolId || schedule?.sekolahId || '').toUpperCase() === 'ALL'
                    ? (scope === 'all' || !schoolIds.length || schoolIds.includes(studentSchoolId))
                    : (!directSchoolId || directSchoolId === studentSchoolId);
                if (!schoolMatch) return false;

                const targetScope = String(schedule?.targetScope || '').toLowerCase();
                if (targetScope === 'all' || (!targetScope && !schedule?.targetClassIds && !schedule?.classIds && !schedule?.classId)) return true;
                const targetIds = (schedule?.targetClassIds || schedule?.classIds || (schedule?.classId ? [schedule.classId] : [])).map(String);
                if (!targetIds.length) return true;
                const studentClassId = String(student?.classId || student?.kelasId || '').trim();
                const studentClassName = normalizeSubjectName(student?.className || student?.class || student?.kelas || student?.namaKelas || '');
                return targetIds.some(id => id === studentClassId || classes.some(c => String(c.id) === id && String(c.name || c.className || c.kelas || '').trim().toLowerCase() === studentClassName));
            };

            const monitoringSchedules = filteredSchedulesBySubject;
            const rows = monitoringSchedules.flatMap(schedule => {
                const scheduleId = String(schedule.id || schedule.scheduleId || '');
                return students.filter(student => {
                    const sid = String(student.schoolId || student.sekolahId || '').trim();
                    return registeredSchoolIds.has(sid) && accessibleSchoolIds.has(sid) && scheduleTargetsStudent(schedule, student);
                }).map(student => {
                    const studentId = String(student.id || student.studentId || '').trim();
                    const participant = participants.find(p => String(p.studentId || p.muridId || '') === studentId && String(p.scheduleId || p.examScheduleId || '') === scheduleId);
                    const studentAttempts = attempts.filter(a => String(a.studentId || a.muridId || '') === studentId && String(a.scheduleId || a.examScheduleId || '') === scheduleId);
                    const attempt = studentAttempts.slice().sort((a,b) => String(b.submittedAt || b.startedAt || b.serverStartTime || b.updatedAt || '').localeCompare(String(a.submittedAt || a.startedAt || a.serverStartTime || a.updatedAt || '')))[0];
                    const result = results.find(r => (attempt?.id && String(r.attemptId) === String(attempt.id)) || (String(r.studentId || r.muridId || '') === studentId && String(r.scheduleId || r.examScheduleId || '') === scheduleId));
                    const status = participant?.status || attempt?.status || (result ? 'SUBMITTED' : 'BELUM MENGERJAKAN');
                    return {
                        student,
                        studentSchoolId: String(student.schoolId || student.sekolahId || '').trim(),
                        schedule,
                        participant: participant || { id: `virtual-${scheduleId}-${studentId}`, studentId, scheduleId, status: 'BELUM MENGERJAKAN' },
                        attempt,
                        result,
                        status,
                        subjectId: getScheduleSubjectId(schedule),
                        package: getSchedulePackage(schedule)
                    };
                });
            });

            const counts = {
                total: rows.length,
                notStarted: rows.filter(r => ['BELUM MENGERJAKAN','ASSIGNED',''].includes(String(r.status).toUpperCase())).length,
                inProgress: rows.filter(r => ['IN_PROGRESS','STARTED','ONGOING'].includes(String(r.status).toUpperCase())).length,
                finished: rows.filter(r => ['SUBMITTED','FINISHED','COMPLETED','FORCE_SUBMITTED'].includes(String(r.status).toUpperCase())).length
            };
            const download = () => {

        const makeExamToken = () => 'AKS-' + Math.random().toString(36).slice(2,8).toUpperCase();
        const AdminExamSchedules = () => {
            const { user } = React.useContext(AppContext);
            const registeredSchools = getRegisteredSchools();
            const defaultSchoolId = String(user?.schoolId || user?.sekolahId || 'ALL').trim();
            const [editing,setEditing] = React.useState(null);

            const [error,setError] = React.useState('');
            const [saving,setSaving] = React.useState(false);
            const allClasses = React.useMemo(() => getRegisteredClasses().filter(c => String(c.status || 'ACTIVE').toUpperCase() !== 'INACTIVE'), []);
            const classesForSchool = React.useMemo(() => {
                const sid = String(editing?.schoolId || '').trim();

            React.useEffect(() => {
                const refresh = () => setItems(mergeLatestSchedules(DEMO_DB.examSchedules || []));

                window.addEventListener('aksara:firebase-changed', refresh);
                return () => { window.removeEventListener('aksara:schedules-changed', refresh); window.removeEventListener('aksara:firebase-changed', refresh); };
            }, []);
            const ensureToken = x => x.token || makeExamToken();
            const regenerate = x => {
                if (!window.confirm('Regenerasi Token Ujian? Token lama tidak lagi berlaku.')) return;
                const next = { ...x, token: makeExamToken(), updatedAt: new Date().toISOString() };
                const data = items.map(item => item.id === x.id ? next : item);
                DEMO_DB.examSchedules = data; setItems([...data]); aksaraFbPersistCollection('examSchedules', data); setNotice('Token Ujian berhasil diregenerasi.');
                window.dispatchEvent(new CustomEvent('aksara:schedules-changed'));
            };
            const copyToken = async x => {
                const token = ensureToken(x);
                if (!x.token) { const data = items.map(item => item.id === x.id ? { ...item, token } : item); DEMO_DB.examSchedules = data; setItems([...data]); aksaraFbPersistCollection('examSchedules', data); }
                try { await navigator.clipboard.writeText(token); setNotice('Token Ujian disalin.'); } catch (e) { setNotice('Token tersedia, tetapi gagal disalin otomatis.'); }
            };
            const open = (item = null) => {
                const x = item || { packageId:'', examDate:'', duration:60, status:'OPEN', schoolId:defaultSchoolId, targetScope:'all', targetClassIds:[], attemptMode:'ONCE', maxAttempts:1 };
                const sid = String(x.schoolId || defaultSchoolId || 'ALL').trim();
                const schoolScope = String(x.schoolScope || (sid.toUpperCase()==='ALL' ? 'all' : 'single')).toLowerCase();
                const existingTargets = [...(x.targetClassIds || x.classIds || (x.classId ? [x.classId] : []))].map(String);
                setError(''); setNotice('');

                    ...x,
                    id:x.id || '',
                    packageId:x.packageId || x.examId || '',
                    subjectId:x.subjectId || x.mapelId || '',
                    subjectName:x.subjectName || x.mapelName || x.subject || '',
                    schoolId:sid,
                    schoolScope,
                    examDate:x.examDate || (x.startTime ? String(x.startTime).slice(0,10) : ''),

                    targetClassIds:existingTargets
                });
            };
            const save = async e => {
                e.preventDefault(); if (saving) return; setError('');
                const packageId = String(editing?.packageId || editing?.examId || '').trim();
                const schoolScope = String(editing?.schoolScope || (String(editing?.schoolId || '').toUpperCase()==='ALL' ? 'all' : 'single')).toLowerCase();
                const sid = schoolScope === 'all' ? 'ALL' : String(editing?.schoolId || '').trim();
                const targetScope = String(editing?.targetScope || 'all').toLowerCase();
                const selectedClassIds = [...new Set((editing?.targetClassIds || []).map(String).filter(id => classesForSchool.some(c => String(c.id) === id)))];
                if (!packageId) return setError('Paket ujian wajib dipilih.');
                if (schoolScope !== 'all' && (!sid || !registeredSchools.some(s => String(s.id) === sid))) return setError('Pilih sekolah yang terdaftar atau gunakan opsi Semua Sekolah.');
                if (!editing?.examDate) return setError('Tanggal pelaksanaan ujian wajib diisi.');
                if (Number(editing?.duration) < 1) return setError('Durasi pengerjaan minimal 1 menit.');
                if (targetScope === 'manual' && !selectedClassIds.length) return setError('Pilih minimal satu kelas untuk jadwal ini.');
                setSaving(true);
                const selectedPackage = DEMO_DB.examPackages.find(p => String(p.id) === packageId || String(p.examId || '') === packageId);

                    id:editing.id || `SCHED-${Date.now()}`,

                    examId:packageId,

                    schoolId:sid,
                    schoolScope,
                    schoolIds:schoolScope === 'all' ? registeredSchools.map(s => String(s.id)) : [sid],
                    targetScope,
                    targetClassIds:targetIds,
                    classIds:targetIds,
                    classId:targetIds[0] || '',
                    token:editing.token || makeExamToken(),
                    status:String(editing.status || 'OPEN').toUpperCase(),
                    publishStatus:String(editing.status || 'OPEN').toUpperCase(),
                    examDate:editing.examDate,
                    startTime:`${editing.examDate}T00:00:00`,
                    endTime:null,
                    duration:Number(editing.duration || selectedPackage?.duration || 60),
                    attemptMode:retry?'RETRY':'ONCE',
                    allowRetry:retry,
                    maxAttempts:retry ? Math.max(2, Number(editing.maxAttempts) || 2) : 1,
                    createdAt:editing.createdAt || now,
                    updatedAt:now
                };
                try {
                    // Simpan ke cache lokal terlebih dahulu agar popup tidak menunggu Firebase/Canva.
                    const saved = normalizeScheduleRecord(next);
                    const data = editing.id ? items.map(x => String(x.id || x.scheduleId) === String(saved.id || saved.scheduleId) ? saved : x) : [...items.filter(x => String(x.scheduleId || x.id) !== String(saved.scheduleId)), saved];

                            if (canonicalUser.role === 'ADMIN_SUPER') setRoute('admin/dashboard');
                            else if (canonicalUser.role === 'GURU') setRoute('guru/dashboard');
                            else if (canonicalUser.role === 'MURID') setRoute('murid/dashboard');
                            else if (canonicalUser.role === 'ORANG_TUA') setRoute('orangtua/dashboard');
                        };
                        mockApiService.getDashboardData(storedToken, parsedUser.role)
                            .then(restore)
                            .catch(() => {
                                // Token lokal hanya dipakai untuk memulihkan UI; Firebase menjadi sumber data utama.
                                restore();
                            })
                            .finally(() => setIsCheckingAuth(false));
                    } catch (e) {
                        setIsCheckingAuth(false);
                    }
                } else {
                    setIsCheckingAuth(false);
                }
            }, []);

            React.useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const handleLogin = (userData, sessionToken) => {
                const canonicalUser = hydrateStudentAccount(userData);
                setUser(canonicalUser);
                setToken(sessionToken);
                localStorage.setItem('aksara_token', sessionToken);
                localStorage.setItem('aksara_user', JSON.stringify(canonicalUser));
                
                if(userData.role === 'ADMIN_SUPER') setRoute('admin/dashboard');
                else if(userData.role === 'GURU') setRoute('guru/dashboard');
                else if(userData.role === 'MURID') setRoute('murid/dashboard');
                else if(userData.role === 'ORANG_TUA') setRoute('orangtua/dashboard');
                else setRoute('landing');
            };

            const handleLogout = () => {
                try {
                    Object.keys(sessionStorage).filter(key => key.startsWith('aksara_draft_')).forEach(key => sessionStorage.removeItem(key));
                } catch (e) {}
                setUser(null);
                setToken(null);
                localStorage.removeItem('aksara_token');
                localStorage.removeItem('aksara_user');
                setRoute('login');
            };

            const contextValue = { user, token, login: handleLogin, logout: handleLogout, setRoute };

            if (isCheckingAuth) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50">
                        <Icon name="loader-2" className="w-8 h-8 text-aksara-600 animate-spin mb-4" />
                        <p className="text-gray-500 text-sm font-medium">Memverifikasi Sesi...</p>
                    </div>
                );
            }

            return (
                <AppContext.Provider value={contextValue}>
                    {route === 'landing' && <LandingPage setRoute={setRoute} />}
                    {route === 'login' && <LoginPage />}
                    {route === 'forgot-password' && <ForgotPasswordPage />}
                    
                    {route.startsWith('murid/exam-room/') ? (
                        !user ? <ErrorState code={401} message="Sesi Anda telah berakhir." onBack={() => setRoute('login')} /> : <ExamRoom scheduleId={route.split('/')[2]} />
                    ) : route.includes('dashboard') || route.includes('admin/') || route.includes('guru/') || route.includes('orangtua/') || route.includes('murid/') ? (
                        !user ? <ErrorState code={401} message="Sesi Anda telah berakhir." onBack={() => setRoute('login')} /> : (
                            <DashboardLayout>
                                {route.startsWith('admin/') && user.role === 'ADMIN_SUPER' && <AdminRouter route={route} />}
                                {route.startsWith('guru/') && user.role === 'GURU' && <GuruRouter route={route} />}
                                {route.startsWith('murid/') && user.role === 'MURID' && <MuridRouter route={route} />}
                                {route === 'orangtua/settings' && <AdminSettings />}
                                {route === 'orangtua/dashboard' && <OrangTuaDashboard />}
                            </DashboardLayout>
                        )
                    ) : null}
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Dummy Service Worker Registration for PWA Installation Capability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // In a real environment, point to an actual sw.js file
                // navigator.serviceWorker.register('/sw.js').then(...);
                console.log('[PWA] Service Worker configuration ready for production.');
            });
        }
    </script>
 
</body></html>
